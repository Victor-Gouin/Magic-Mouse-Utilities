name: Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Build Windows x64 Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $cargo = Get-Content Cargo.toml -Raw
            if ($cargo -match 'version\s*=\s*"([^"]+)"') {
              $ver = $Matches[1]
            } else {
              $ver = "0.1.0"
            }
          }
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version: $ver"

      - name: Run unit tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) {
              $iscc = $cmd.Source
            } else {
              choco install innosetup -y
              $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            }
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.APP_VERSION }}" "installer\MagicMouseStudio.iss"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: magic-mouse-studio-windows-x64
          path: |
            installer/output/MagicMouseStudio-Setup-*.exe
            target/release/magic-mouse-win.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            installer/output/MagicMouseStudio-Setup-*.exe
            target/release/magic-mouse-win.exe
